name: Update card from brain

# Every Monday, or by hand from the Actions tab.
# Opens a pull request with the changes. You review and merge.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update card.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/update-card.mjs
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: card-update
          commit-message: Update card from brain
          title: Weekly card update
          body: Updated `card.json` from `brain/`. Check the numbers before merging.
          add-paths: card.json
